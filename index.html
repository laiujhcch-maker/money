<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>櫃體計價工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #F2EDE4;
    --panel: #FFFFFF;
    --ink: #2B241C;
    --ink-soft: #6E6355;
    --wood: #8A5A3B;
    --wood-deep: #5F3B24;
    --line: #DED4C2;
    --accent-low: #7A8B6F;
    --total-bg: #2B241C;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(90deg, rgba(138,90,59,0.035) 0px, rgba(138,90,59,0.035) 1px, transparent 1px, transparent 64px);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }

  .page{
    width: 100%;
    max-width: 760px;
  }

  header{
    margin-bottom: 36px;
  }

  .eyebrow-line{
    display:flex;
    align-items:center;
    gap: 10px;
    color: var(--wood);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .eyebrow-line svg{ flex-shrink:0; }

  h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 8px;
    color: var(--wood-deep);
  }

  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    max-width: 46ch;
  }

  .cards{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 600px){
    .cards{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:4px; height:100%;
    background: var(--wood);
  }
  .card.low::before{ background: var(--accent-low); }

  .card h2{
    font-family: 'Noto Serif TC', serif;
    font-size: 19px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card .desc{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .field{
    margin-bottom: 14px;
  }
  .field label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-row{
    display:flex;
    align-items:center;
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow:hidden;
    background: #FBF9F5;
  }
  .field-row input{
    border:none;
    background:transparent;
    padding: 11px 12px;
    font-size: 16px;
    font-family:'Inter',sans-serif;
    width: 100%;
    color: var(--ink);
    outline:none;
  }
  .field-row .unit{
    padding: 0 12px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space:nowrap;
    border-left: 1px solid var(--line);
    background: #F2EDE4;
    align-self:stretch;
    display:flex;
    align-items:center;
  }
  .field-row:focus-within{
    border-color: var(--wood);
  }

  .subtotal{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .subtotal .label{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .subtotal .value{
    font-family:'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--wood-deep);
  }
  .card.low .subtotal .value{ color: var(--accent-low); }

  .total-bar{
    background: var(--total-bg);
    border-radius: 4px;
    padding: 26px 28px;
    color: #F2EDE4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .total-bar .left .label{
    font-size: 13px;
    color: #C9C0AE;
    margin-bottom: 6px;
  }
  .total-bar .left .breakdown{
    font-size: 12px;
    color: #948B79;
  }
  .total-bar .value{
    font-family:'Noto Serif TC', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  footer{
    margin-top: 28px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow-line">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 8L12 3L20 8V20H4V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 20V13H15V20" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      櫃體報價
    </div>
    <h1>尺數換算價格</h1>
    <p>輸入櫃體的尺數，依單價自動換算金額；高櫃與矮櫃可分別計算，下方顯示總計。單價可依實際報價調整。</p>
  </header>

  <div class="cards">

    <div class="card high">
      <h2>高櫃</h2>
      <div class="desc">單價可調整，預設每尺 3600 元</div>

      <div class="field">
        <label for="high-price">單價（元／尺）</label>
        <div class="field-row">
          <input id="high-price" type="number" value="3600" min="0" step="1">
          <span class="unit">元 / 尺</span>
        </div>
      </div>

      <div class="field">
        <label for="high-length">櫃體尺數</label>
        <div class="field-row">
          <input id="high-length" type="number" placeholder="0" min="0" step="0.1">
          <span class="unit">尺</span>
        </div>
      </div>

      <div class="subtotal">
        <span class="label">高櫃小計</span>
        <span class="value" id="high-subtotal">NT$ 0</span>
      </div>
    </div>

    <div class="card low">
      <h2>矮櫃</h2>
      <div class="desc">單價可調整，預設每尺 2600 元</div>

      <div class="field">
        <label for="low-price">單價（元／尺）</label>
        <div class="field-row">
          <input id="low-price" type="number" value="2600" min="0" step="1">
          <span class="unit">元 / 尺</span>
        </div>
      </div>

      <div class="field">
        <label for="low-length">櫃體尺數</label>
        <div class="field-row">
          <input id="low-length" type="number" placeholder="0" min="0" step="0.1">
          <span class="unit">尺</span>
        </div>
      </div>

      <div class="subtotal">
        <span class="label">矮櫃小計</span>
        <span class="value" id="low-subtotal">NT$ 0</span>
      </div>
    </div>

  </div>

  <div class="total-bar">
    <div class="left">
      <div class="label">總計</div>
      <div class="breakdown" id="breakdown">高櫃 NT$ 0　+　矮櫃 NT$ 0</div>
    </div>
    <div class="value" id="grand-total">NT$ 0</div>
  </div>

  <footer>金額四捨五入至整數，僅供估算參考</footer>

</div>

<script>
  function fmt(n){
    return 'NT$ ' + Math.round(n).toLocaleString('zh-TW');
  }

  function calc(){
    const highPrice = parseFloat(document.getElementById('high-price').value) || 0;
    const highLength = parseFloat(document.getElementById('high-length').value) || 0;
    const lowPrice = parseFloat(document.getElementById('low-price').value) || 0;
    const lowLength = parseFloat(document.getElementById('low-length').value) || 0;

    const highSub = highPrice * highLength;
    const lowSub = lowPrice * lowLength;
    const total = highSub + lowSub;

    document.getElementById('high-subtotal').textContent = fmt(highSub);
    document.getElementById('low-subtotal').textContent = fmt(lowSub);
    document.getElementById('grand-total').textContent = fmt(total);
    document.getElementById('breakdown').textContent =
      '高櫃 ' + fmt(highSub) + '　+　矮櫃 ' + fmt(lowSub);
  }

  ['high-price','high-length','low-price','low-length'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });

  calc();
</script>

</body>
</html>
